<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Deep premium gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    
    <!-- Glowing emerald gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Dark felt center background -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#062e1b" />
      <stop offset="70%" stop-color="#02140b" />
      <stop offset="100%" stop-color="#010402" />
    </radialGradient>
  </defs>

  <!-- Outer Ring / Casino Chip Boundary -->
  <circle cx="32" cy="32" r="30" fill="url(#goldGrad)" />
  <circle cx="32" cy="32" r="28" fill="#010402" />

  <!-- 8 Golden Radial Stripes/Notches of Casino Chip -->
  <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="2.5" x2="32" y2="6.5" />
    <line x1="32" y1="57.5" x2="32" y2="61.5" />
    <line x1="2.5" y1="32" x2="6.5" y2="32" />
    <line x1="57.5" y1="32" x2="61.5" y2="32" />
    <line x1="11.2" y1="11.2" x2="14.2" y2="14.2" />
    <line x1="49.8" y1="49.8" x2="52.8" y2="52.8" />
    <line x1="11.2" y1="49.8" x2="14.2" y2="46.8" />
    <line x1="49.8" y1="11.2" x2="52.8" y2="14.2" />
  </g>

  <!-- Inner Rim with Emerald glow -->
  <circle cx="32" cy="32" r="23" fill="url(#darkBg)" stroke="url(#emeraldGrad)" stroke-width="1.8" />
  
  <!-- Fine inner dotted line -->
  <circle cx="32" cy="32" r="19.5" stroke="#34d399" stroke-width="0.5" stroke-dasharray="1 1.5" opacity="0.5" />

  <!-- Drop Shadow for BA Logo in center -->
  <text 
    x="31.5" 
    y="41.5" 
    font-family="'Kanit', 'Arial Black', Impact, sans-serif" 
    font-size="25" 
    font-weight="900" 
    font-style="italic" 
    text-anchor="middle" 
    fill="#000000" 
    opacity="0.75"
  >
    <tspan>B</tspan><tspan dx="-1">A</tspan>
  </text>

  <!-- Actual BA Logo in center -->
  <text 
    x="30" 
    y="40" 
    font-family="'Kanit', 'Arial Black', Impact, sans-serif" 
    font-size="25" 
    font-weight="900" 
    font-style="italic" 
    text-anchor="middle"
  >
    <tspan fill="#ffffff">B</tspan><tspan fill="#10b981" dx="-1">A</tspan>
  </text>
</svg>
